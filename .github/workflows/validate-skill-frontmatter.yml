name: Validate Plugin Metadata

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-plugin-metadata:
    runs-on: blacksmith-2vcpu-ubuntu-2204

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Windmill skill frontmatter
        run: python scripts/validate_skill_frontmatter.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cursor plugin
        run: node scripts/validate_cursor_plugin.mjs
